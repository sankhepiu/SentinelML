# Static SPA + reverse proxy to the backend service, so the dashboard's
# fetch('/api/v1/...') calls stay same-origin (no CORS needed) whether
# you're running via Vite's dev proxy or this container.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # "backend" is the docker-compose service name (Docker's embedded DNS
    # resolves it) -- override with a different upstream if you deploy the
    # two images separately.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing (React Router) -- any path that isn't a real
    # file falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
