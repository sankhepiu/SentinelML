[project]
name = "sentinelml"
version = "0.1.0"
description = "SentinelML core ML pipeline: data ingestion, preprocessing, training, evaluation, and inference for the CICIDS2017 network intrusion detection platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "xgboost>=2.1",
    "joblib>=1.4",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "lightgbm>=4.7.0",
]

[project.scripts]
sentinel = "ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml"]

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "black>=24.10.0",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# E501 (line too long) is left to Black, which owns line-wrapping decisions.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ml", "app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Path() are meant to be called in argument
# defaults -- that's how dependency injection is declared.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "backend/tests"]
addopts = "-ra"
