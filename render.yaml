# Render Blueprint for the backend inference API. Import this repo at
# https://dashboard.render.com/select-repo?type=blueprint and Render reads
# this file automatically -- see the README's Deployment section for the
# full walkthrough (this alone doesn't cover the frontend, which is
# deployed to Vercel separately, or the one-time CORS origin you set after
# the frontend's URL is known).
services:
  - type: web
    name: sentinelml-backend
    runtime: docker
    plan: free
    region: oregon
    # Build context must be the repo root -- backend/Dockerfile COPYs in
    # ml/ (the sentinelml package it depends on via a uv workspace source)
    # as well as backend/. See the comment at the top of that Dockerfile.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: SENTINELML_ENVIRONMENT
        value: production
      - key: SENTINELML_LOG_LEVEL
        value: INFO
      # Pin a specific trained-model version instead of always serving the
      # latest one under ml/models/artifacts/. Leave blank for "latest".
      - key: SENTINELML_MODEL_VERSION
        value: ""
      # Vercel mints a new origin per preview deployment, which a plain
      # allow-list can't cover -- this regex matches the production domain
      # (sentinel-ml-omega.vercel.app) plus every preview subdomain Vercel
      # mints for the same project (sentinel-ml-omega-<hash>-<user>.vercel.app).
      # Adjust if the Vercel project is ever renamed.
      - key: SENTINELML_CORS_ALLOW_ORIGIN_REGEX
        value: "^https://sentinel-ml.*\\.vercel\\.app$"
      # Set only if a custom domain is added that the regex above wouldn't
      # match (a JSON array, e.g. ["https://sentinelml.example.com"]) --
      # sync: false means Render leaves this to be set manually in the
      # dashboard rather than tracking it in this file.
      - key: SENTINELML_CORS_ALLOW_ORIGINS
        sync: false
