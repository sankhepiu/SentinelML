name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python lint & test (ml + backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --dev --all-packages

      - name: Ruff check
        run: uv run ruff check .

      - name: Black check
        run: uv run black --check .

      - name: Pytest
        run: uv run pytest

  frontend:
    name: Frontend lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Type-check & build
        run: npm run build

  backend-verify:
    name: Backend live verification
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      # No trained model artifacts exist in CI (ml/models/artifacts/ is
      # gitignored) -- this verifies the real CLI-launched process starts
      # cleanly and reports the correct not-ready state, not just that
      # pytest's TestClient can construct an app in-process.
      - name: Start the API
        run: |
          nohup uv run sentinel serve --port 8000 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for the server to come up
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not come up in time" >&2
          cat server.log
          exit 1

      - name: Verify /health is 200
        run: |
          status=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8000/api/v1/health)
          cat /tmp/health.json
          test "$status" = "200"

      - name: Verify /ready correctly reports not-ready without a trained model
        run: |
          status=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:8000/api/v1/ready)
          cat /tmp/ready.json
          test "$status" = "503"

      - name: Verify the OpenAPI schema is well-formed
        run: curl -sf http://127.0.0.1:8000/openapi.json | uv run python -c "import json,sys; json.load(sys.stdin)"

      - name: Show server log on failure
        if: failure()
        run: cat server.log

      - name: Stop the API
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  docker:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the backend to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time" >&2
          docker compose logs
          exit 1

      - name: Verify the backend directly
        run: |
          curl -sf http://127.0.0.1:8000/api/v1/health
          # No trained model artifacts are mounted in CI -- /ready should
          # correctly report 503, not crash or falsely report 200.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/ready)
          test "$status" = "503"

      - name: Verify the frontend serves the SPA
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ | grep -qi '<div id="root">'; then
              echo "frontend is up"
              exit 0
            fi
            sleep 2
          done
          echo "frontend did not come up in time" >&2
          docker compose logs
          exit 1

      - name: Verify the frontend proxies /api to the backend
        run: curl -sf http://127.0.0.1:8080/api/v1/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
